<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ר.מזור — המסמכים שלי</title>
<meta name="theme-color" content="#1e3a8a">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Heebo',sans-serif;background:#f0f4f8;color:#1e293b;padding:16px;max-width:540px;margin:0 auto}
.hdr{background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;border-radius:14px;padding:18px;text-align:center;margin-bottom:16px}
.hdr h1{font-size:1.2rem;font-weight:900}
.hdr .sub{font-size:0.78rem;opacity:.9;margin-top:4px}
.card{background:#fff;border:1.5px solid #dde3ed;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 5px rgba(0,0,0,.05)}
label{display:block;font-size:0.82rem;font-weight:700;color:#475569;margin-bottom:6px}
input{width:100%;border:1.5px solid #dde3ed;border-radius:10px;padding:12px;font-family:'Heebo',sans-serif;font-size:0.95rem;direction:ltr;text-align:right}
.btn{border:none;border-radius:11px;padding:14px;font-family:'Heebo',sans-serif;font-size:1rem;font-weight:800;cursor:pointer;width:100%;background:#2563eb;color:#fff;margin-top:12px}
.btn:disabled{opacity:.6}
.err{color:#dc2626;font-size:0.82rem;font-weight:700;margin-top:8px;display:none}
.sec-title{font-weight:800;font-size:0.95rem;margin:2px 0 10px;display:flex;align-items:center;gap:7px}
.tag-driver{background:#ede9fe;color:#6d28d9;border-radius:999px;padding:2px 9px;font-size:0.66rem;font-weight:800}
.tag-vehicle{background:#cffafe;color:#0e7490;border-radius:999px;padding:2px 9px;font-size:0.66rem;font-weight:800}
.drow{display:flex;justify-content:space-between;padding:8px 2px;border-bottom:1px solid #f1f5f9;font-size:0.88rem}
.drow b{font-weight:700}
.badge{border-radius:999px;padding:2px 10px;font-size:0.72rem;font-weight:800}
.b-ok{background:#dcfce7;color:#15803d}.b-warn{background:#fef3c7;color:#92400e}.b-bad{background:#fee2e2;color:#b91c1c}
.photos{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.photo{width:88px;height:88px;border-radius:10px;overflow:hidden;border:1.5px solid #dde3ed;cursor:pointer;position:relative}
.photo img{width:100%;height:100%;object-fit:cover}
.photo-label{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.55);color:#fff;font-size:0.56rem;padding:2px;text-align:center}
.loading{text-align:center;padding:34px;color:#64748b}
.vinfo{background:#eff6ff;border:1.5px solid #bfdbfe;border-radius:10px;padding:12px;font-size:0.92rem;line-height:1.7;margin-bottom:14px}
#lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:99;align-items:center;justify-content:center;padding:16px}
#lightbox img{max-width:100%;max-height:100%;border-radius:8px}
.signout{text-align:center;margin-top:8px}.signout a{color:#64748b;font-size:0.78rem;text-decoration:underline;cursor:pointer}
</style>
</head>
<body>

<div class="hdr">
  <h1>📁 המסמכים שלי</h1>
  <div class="sub">ר.מזור — מחלקת הרכב</div>
</div>

<div id="loading" class="loading">טוען…</div>

<!-- מסך הזדהות -->
<div id="auth-card" class="card" style="display:none">
  <div class="sec-title">🔐 כניסה מאובטחת</div>
  <p style="font-size:0.84rem;color:#475569;margin-bottom:12px;line-height:1.6">כדי לראות את המסמכים שלך, הזן/י את כתובת המייל שלך. נשלח אליך קישור כניסה — בלי סיסמה.</p>
  <label>כתובת המייל שלך</label>
  <input id="email" type="email" placeholder="name@nofar-energy.co.il" autocomplete="email">
  <div class="err" id="auth-err"></div>
  <button class="btn" id="send-btn" onclick="sendLink()">📧 שלח לי קישור כניסה</button>
</div>

<!-- תוכן המסמכים -->
<div id="docs" style="display:none">
  <div id="veh-info" class="vinfo"></div>
  <div class="card">
    <div class="sec-title">📅 תוקפים וסטטוס</div>
    <div id="dates"></div>
  </div>
  <div class="card">
    <div class="sec-title">🪪 מסמכי נהג <span class="tag-driver">עוברים איתי</span></div>
    <div id="driver-docs"></div>
  </div>
  <div class="card">
    <div class="sec-title">🚗 מסמכי הרכב <span class="tag-vehicle">של הרכב הנוכחי</span></div>
    <div id="vehicle-docs"></div>
  </div>
  <div class="signout"><a onclick="doSignOut()">התנתקות</a></div>
  <div style="height:20px"></div>
</div>

<div id="lightbox" onclick="this.style.display='none'"><img id="lightbox-img" src=""></div>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyDW6mzShTVBgHH-c5f0hb7FvIRophpgp78",
  authDomain: "niholrechev.firebaseapp.com",
  projectId: "niholrechev",
  storageBucket: "niholrechev.firebasestorage.app",
  messagingSenderId: "347809967171",
  appId: "1:347809967171:web:af3eb5cdeefc827b41f8f6"
});
const db = firebase.firestore();
const params = new URLSearchParams(location.search);
const TENANT = (params.get('t') || 'nofar');
const fcol = () => db.collection('tenants').doc(TENANT).collection('data');
function emailKey(e){ return String(e||'').trim().toLowerCase().replace(/[^a-z0-9]/g,'_'); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const CLEAN_URL = location.href.split('?')[0] + '?t=' + encodeURIComponent(TENANT);
const actionCodeSettings = { url: CLEAN_URL, handleCodeInApp: true };

function show(id){ document.getElementById(id).style.display = (id==='docs'?'block':'block'); }
function showErr(m){ const e=document.getElementById('auth-err'); e.textContent=m; e.style.display='block'; }
function showAuth(msg){
  document.getElementById('loading').style.display='none';
  document.getElementById('docs').style.display='none';
  document.getElementById('auth-card').style.display='block';
  if(msg) showErr(msg);
}

async function sendLink(){
  const email = (document.getElementById('email').value||'').trim();
  if(!/^\S+@\S+\.\S+$/.test(email)){ showErr('כתובת מייל לא תקינה'); return; }
  const btn=document.getElementById('send-btn'); btn.disabled=true; btn.textContent='שולח…';
  try {
    await firebase.auth().sendSignInLinkToEmail(email, actionCodeSettings);
    window.localStorage.setItem('mydocs_email', email);
    document.getElementById('auth-card').innerHTML =
      '<div style="text-align:center;padding:16px"><div style="font-size:2.8rem">📧</div>'+
      '<h2 style="margin:10px 0 6px;font-size:1.25rem">נשלח אליך קישור!</h2>'+
      '<p style="color:#475569;line-height:1.6">בדוק/י את המייל <b dir="ltr">'+esc(email)+'</b> ולחץ/י על הקישור כדי להיכנס ולראות את המסמכים שלך.</p>'+
      '<p style="color:#94a3b8;font-size:0.76rem;margin-top:10px">לא הגיע? בדוק/י גם בספאם, או נסה/י שוב עוד רגע.</p></div>';
  } catch(e){ btn.disabled=false; btn.textContent='📧 שלח לי קישור כניסה'; showErr('שגיאה בשליחה: '+(e.code||e.message)); }
}
function doSignOut(){ firebase.auth().signOut().then(()=>location.href=CLEAN_URL); }

function _dateBadge(s){
  if(!s) return '<span class="badge b-warn">—</span>';
  const m=String(s).match(/(\d{1,2})[.\/](\d{1,2})[.\/](\d{2,4})/);
  if(!m) return '<span class="badge b-ok">'+esc(s)+'</span>';
  let y=m[3]; if(y.length===2) y='20'+y;
  const d=new Date(+y,+m[2]-1,+m[1]); const days=Math.ceil((d-new Date())/86400000);
  const cls = days<0?'b-bad':(days<=30?'b-warn':'b-ok');
  const note = days<0?('פג לפני '+Math.abs(days)+' ימים'):(days<=30?('בעוד '+days+' ימים'):'בתוקף');
  return '<span class="badge '+cls+'">'+esc(s)+' · '+note+'</span>';
}
function _photoHtml(arr, fallback){
  if(!arr || !arr.length) return '<div style="color:#94a3b8;font-size:0.8rem">'+fallback+'</div>';
  return '<div class="photos">'+arr.map(p =>
    '<div class="photo" onclick="_zoom(\''+p.b64+'\')"><img src="data:image/jpeg;base64,'+p.b64+'">'+
    (p.label?'<div class="photo-label">'+esc(p.label)+'</div>':'')+'</div>').join('')+'</div>';
}
function _zoom(b64){ document.getElementById('lightbox-img').src='data:image/jpeg;base64,'+b64; document.getElementById('lightbox').style.display='flex'; }

function render(d){
  document.getElementById('loading').style.display='none';
  document.getElementById('auth-card').style.display='none';
  document.getElementById('docs').style.display='block';
  document.getElementById('veh-info').innerHTML =
    '🚗 <b>'+esc((d.make||'')+' '+(d.model||''))+'</b> · <span dir="ltr">'+esc(d.plate||'')+'</span>'+
    (d.driver?'<br>שלום, <b>'+esc(d.driver)+'</b> 👋':'');
  document.getElementById('dates').innerHTML =
    '<div class="drow"><span>📋 נהלים ואחריות</span>'+(String(d.procedures||'').trim()?'<span class="badge b-ok">✓ נחתם ('+esc(d.procedures)+')</span>':'<span class="badge b-warn">טרם נחתם</span>')+'</div>'+
    '<div class="drow"><span>🪪 תוקף רישיון נהיגה</span>'+_dateBadge(d.licenseExpiry)+'</div>'+
    '<div class="drow"><span>🚗 תוקף רישוי (טסט)</span>'+_dateBadge(d.registrationExpiry)+'</div>'+
    '<div class="drow"><span>🛡️ תוקף ביטוח חובה</span>'+_dateBadge(d.insuranceExpiry)+'</div>';
  const photos = d.photos || [];
  const driverP = photos.filter(p => (p.cat||'')==='driver');
  const vehicleP = photos.filter(p => (p.cat||'')==='vehicle');
  document.getElementById('driver-docs').innerHTML = _photoHtml(driverP, 'אין צילום רישיון נהיגה במערכת. פנה/י למחלקת הרכב.');
  document.getElementById('vehicle-docs').innerHTML = _photoHtml(vehicleP, 'אין צילומי רכב במערכת. פנה/י למחלקת הרכב.');
}

async function loadDocs(email){
  document.getElementById('loading').style.display='block';
  document.getElementById('loading').textContent='טוען את המסמכים שלך…';
  try {
    const snap = await fcol().doc('mydocs_'+emailKey(email)).get();
    if(!snap.exists){
      document.getElementById('loading').innerHTML='<div style="padding:10px">לא נמצאו מסמכים למייל <b dir="ltr">'+esc(email)+'</b>.<br>ייתכן שהמייל לא מעודכן במערכת — פנה/י למחלקת הרכב.<br><br><a onclick="doSignOut()" style="color:#2563eb;text-decoration:underline;cursor:pointer">התנתקות</a></div>';
      return;
    }
    render(snap.data());
  } catch(e){ document.getElementById('loading').innerHTML='שגיאה בטעינת המסמכים ('+(e.code||e.message)+')'; console.log(e); }
}

(async function init(){
  try {
    if (firebase.auth().isSignInWithEmailLink(location.href)) {
      let email = window.localStorage.getItem('mydocs_email');
      if(!email) email = window.prompt('אשר/י את כתובת המייל שאליה נשלח הקישור:');
      try {
        await firebase.auth().signInWithEmailLink(email, location.href);
        window.localStorage.removeItem('mydocs_email');
        history.replaceState(null,'',CLEAN_URL);
      } catch(e){ showAuth('הקישור אינו תקף או שפג תוקפו — בקש/י קישור חדש.'); return; }
    }
  } catch(e){}
  firebase.auth().onAuthStateChanged(user => {
    if (user && user.email) loadDocs(user.email);
    else showAuth();
  });
})();
</script>
</body>
</html>
