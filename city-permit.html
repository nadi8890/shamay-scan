<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ר.מזור — אישור החזקה ברכב לעירייה</title>
<meta name="theme-color" content="#047857">
<meta name="apple-mobile-web-app-title" content="ר.מזור">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Heebo',sans-serif;background:#f0f4f8;color:#1e293b;padding:16px;max-width:540px;margin:0 auto}
.hdr{background:linear-gradient(135deg,#047857,#059669);color:#fff;border-radius:14px;padding:18px;text-align:center;margin-bottom:16px}
.hdr h1{font-size:1.15rem;font-weight:900}
.hdr .sub{font-size:0.78rem;opacity:.9;margin-top:4px}
.card{background:#fff;border:1.5px solid #dde3ed;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 5px rgba(0,0,0,.05)}
.sec-title{font-weight:800;font-size:0.92rem;color:#065f46;margin:4px 0 10px;display:flex;align-items:center;gap:6px}
label{display:block;font-size:0.78rem;font-weight:700;color:#475569;margin-bottom:5px;margin-top:10px}
input,select{width:100%;border:1.5px solid #dde3ed;border-radius:10px;padding:10px;font-family:'Heebo',sans-serif;font-size:0.9rem;background:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.btn{border:none;border-radius:11px;padding:14px;font-family:'Heebo',sans-serif;font-size:1rem;font-weight:800;cursor:pointer;width:100%;background:#059669;color:#fff}
.btn:disabled{opacity:.6}
.hint{font-size:0.72rem;color:#64748b;margin-top:5px}
.err{color:#dc2626;font-size:0.82rem;font-weight:700;margin-top:8px;display:none;text-align:center}
.veh{background:#ecfdf5;border:1.5px solid #a7f3d0;border-radius:10px;padding:11px;font-size:0.88rem;margin-bottom:6px;line-height:1.6;display:none}
.readrow{display:flex;justify-content:space-between;gap:8px;font-size:0.85rem;padding:7px 2px;border-bottom:1px solid #f1f5f9}
.readrow b{color:#0f172a}
.readrow span{color:#475569}
.divbox{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px}
.divbox label{display:flex;align-items:center;gap:5px;font-weight:600;font-size:0.85rem;margin:0}
.divbox input{width:auto}
#result{display:none;text-align:center;padding:24px 12px}
#result .badge{width:100px;height:100px;margin:2px auto 0;border-radius:50%;background:linear-gradient(135deg,#047857,#10b981);display:flex;align-items:center;justify-content:center;font-size:3.1rem;box-shadow:0 12px 34px rgba(16,185,129,.42);animation:badgePop .6s cubic-bezier(.17,.67,.32,1.5) both}
#result h2{margin:16px 0 4px;font-size:1.4rem;font-weight:900;color:#065f46}
#result .done-sub{color:#475569;font-size:0.9rem;line-height:1.6}
@keyframes badgePop{0%{transform:scale(0) rotate(-25deg);opacity:0}70%{transform:scale(1.12) rotate(6deg)}100%{transform:scale(1) rotate(0);opacity:1}}
.loading{text-align:center;padding:30px;color:#64748b}
</style>
</head>
<body>

<div class="hdr">
  <h1>🏛️ אישור החזקה ברכב לעירייה</h1>
  <div class="sub">ר.מזור — מחלקת הרכב</div>
</div>

<div id="loading" class="loading">טוען…</div>

<div id="main-card" style="display:none">
  <div class="card">
    <div class="veh" id="veh-info"></div>
    <label>מספר רכב *</label>
    <input id="f-plate" inputmode="numeric" placeholder="12345678" onblur="lookupPlate()">
    <div id="details" style="display:none;margin-top:8px">
      <div class="readrow"><span>שם העובד/ת</span><b id="d-driver">—</b></div>
      <div class="readrow"><span>תעודת זהות</span><b id="d-id">—</b></div>
      <div class="readrow"><span>סוג הרכב</span><b id="d-make">—</b></div>
      <div class="readrow"><span>צבע <span id="d-color-note" style="font-weight:400;color:#94a3b8;font-size:0.72rem"></span></span><b id="d-color">—</b></div>
    </div>
  </div>

  <div class="card">
    <div class="sec-title">🏢 חברה מעסיקה</div>
    <div class="readrow"><span>חברה</span><b id="d-company">—</b></div>
    <div class="readrow"><span>ח.פ</span><b id="d-hp" dir="ltr">—</b></div>
    <div id="div-note" class="hint"></div>
    <div class="divbox">
      <label><input type="radio" name="cp-div" value="israel" onchange="setCompany()"> נופר אנרגיה בישראל</label>
      <label><input type="radio" name="cp-div" value="mata" onchange="setCompany()"> ע.י נופר אנרג'י</label>
    </div>
  </div>

  <div class="card">
    <div class="sec-title">🏛️ העירייה / הרשות</div>
    <label>לכבוד — בחר/י את העירייה שלך *</label>
    <input id="f-city" list="cities" placeholder="הקלד/י או בחר/י — למשל: עיריית חיפה" autocomplete="off">
    <datalist id="cities"></datalist>
    <label>צבע הרכב (אם לא זוהה אוטומטית)</label>
    <input id="f-color-edit" type="text" placeholder="למשל: לבן">
  </div>

  <div class="err" id="err"></div>
  <button class="btn" style="margin-top:6px" id="send-btn" onclick="makePermit()">📄 צור אישור PDF להדפסה</button>
  <div class="hint" style="text-align:center;margin-top:8px">האישור ייווצר עם החתימה השמורה של קצין הבטיחות — מוכן להדפסה והוספת חותמת.</div>
  <div style="height:24px"></div>
</div>

<div id="result">
  <div class="badge">✅</div>
  <h2>האישור נוצר!</h2>
  <p class="done-sub">הקובץ ירד למכשיר.<br>אפשר להדפיס ולהחתים בחותמת החברה.</p>
  <button class="btn" style="margin-top:18px;max-width:280px;margin-left:auto;margin-right:auto" onclick="location.reload()">אישור נוסף</button>
</div>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyDW6mzShTVBgHH-c5f0hb7FvIRophpgp78",
  authDomain: "niholrechev.firebaseapp.com",
  projectId: "niholrechev",
  storageBucket: "niholrechev.firebasestorage.app",
  messagingSenderId: "347809967171",
  appId: "1:347809967171:web:af3eb5cdeefc827b41f8f6"
});
const db = firebase.firestore();
async function ensureAnonAuth() {
  try {
    if (firebase.auth().currentUser) return;
    try { await firebase.auth().setPersistence(firebase.auth.Auth.Persistence.NONE); } catch(e) {}
    await firebase.auth().signInAnonymously();
  } catch(e) { console.log('anon auth unavailable, continuing', e.code || e.message); }
}
const params = new URLSearchParams(location.search);
const TENANT = (params.get('t') || 'nofar');
const fcol = () => db.collection('tenants').doc(TENANT).collection('data');
const urlPlate = (params.get('plate') || '').trim();
let FLEET = [], SIGNATURE = '', VEH = null;

const COMPANIES = {
  israel: { name: 'נופר אנרגיה בישראל בע"מ', hp: '517252987' },
  mata:   { name: 'ע.י נופר אנרג\'י בע"מ',    hp: '514599943' }
};
const AUTHORITIES = ['משטרת ישראל','עיריית תל אביב-יפו','עיריית ירושלים','עיריית חיפה','עיריית ראשון לציון','עיריית פתח תקווה','עיריית אשדוד','עיריית נתניה','עיריית באר שבע','עיריית בני ברק','עיריית חולון','עיריית רמת גן','עיריית אשקלון','עיריית רחובות','עיריית בת ים','עיריית בית שמש','עיריית כפר סבא','עיריית הרצליה','עיריית חדרה','עיריית מודיעין-מכבים-רעות','עיריית לוד','עיריית רמלה','עיריית רעננה','עיריית גבעתיים','עיריית הוד השרון','עיריית קריית אתא','עיריית קריית גת','עיריית נהריה','עיריית קריית ביאליק','עיריית אילת','עיריית ראש העין','עיריית עפולה','עיריית קריית אונו','עיריית קריית מוצקין','עיריית אום אל-פחם','עיריית טבריה','עיריית נס ציונה','עיריית יבנה','עיריית אור יהודה','עיריית מודיעין עילית','עיריית ביתר עילית','עיריית נוף הגליל','עיריית דימונה','עיריית טמרה','עיריית סח\'נין','עיריית שפרעם','עיריית קריית ים','עיריית כרמיאל','עיריית טייבה','עיריית נתיבות','עיריית קלנסווה','עיריית אריאל','עיריית מגדל העמק','עיריית יהוד-מונוסון','עיריית צפת','עיריית אופקים','עיריית קריית שמונה','עיריית טירה','עיריית רהט','עיריית ערד','עיריית גבעת שמואל','עיריית שדרות','עיריית טירת כרמל','עיריית קריית מלאכי','עיריית נשר','עיריית באקה אל-גרביה','עיריית כפר קאסם','עיריית אור עקיבא','עיריית בית שאן','עיריית מעלה אדומים','עיריית מעלות-תרשיחא','עיריית עכו','עיריית זכרון יעקב'];

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function cleanName(name){ let n = String(name||'').split('-')[0].trim(); n = n.replace(/[\s,·]*(ישראל|מטה)[\s,·]*$/,'').trim(); return n; }
function detectDivision(name){ const s = String(name||''); if (s.includes('מטה')) return 'mata'; if (s.includes('ישראל')) return 'israel'; return null; }
async function govColor(plate){
  try {
    const p = String(plate||'').replace(/\D/g,''); if(!p) return '';
    const url = `https://data.gov.il/api/3/action/datastore_search?resource_id=053cea08-09bc-40ec-8f7a-156f0677aff3&q=${encodeURIComponent(p)}&limit=5`;
    const res = await fetch(url); if(!res.ok) return '';
    const data = await res.json();
    const recs = data?.result?.records || [];
    const rec = recs.find(r => String(r.mispar_rechev||'').replace(/\D/g,'') === p) || recs[0];
    return rec ? (rec.tzeva_rechev || '') : '';
  } catch(e){ return ''; }
}
function setCompany(){
  const val = (document.querySelector('input[name="cp-div"]:checked')||{}).value || 'israel';
  const c = COMPANIES[val];
  document.getElementById('d-company').textContent = c.name;
  document.getElementById('d-hp').textContent = c.hp;
}

(async function init(){
  document.getElementById('cities').innerHTML = AUTHORITIES.map(c=>`<option value="${c}">`).join('');
  document.getElementById('loading').style.display = 'none';
  document.getElementById('main-card').style.display = 'block';
  if (urlPlate) document.getElementById('f-plate').value = urlPlate;
  // default division israel until a vehicle resolves
  const r = document.querySelector('input[name="cp-div"][value="israel"]'); if(r) r.checked = true; setCompany();
  try {
    await ensureAnonAuth();
    let d = {};
    try { const s = await fcol().doc('pubroster').get(); if (s.exists) d = s.data()||{}; } catch(e) {}
    if (!Array.isArray(d.vehicles)) { try { const s = await fcol().doc('main').get(); d = s.data() || {}; } catch(e) {} }
    FLEET = d.vehicles || [];
    SIGNATURE = d.officerSignature || '';
    if (urlPlate) lookupPlate();
  } catch(e) { console.log('load failed', e.code || e.message); }
})();

async function lookupPlate(){
  const pd = (document.getElementById('f-plate').value || '').replace(/\D/g,'');
  VEH = FLEET.find(v => String(v.plate||'').replace(/\D/g,'') === pd) || null;
  const box = document.getElementById('veh-info');
  const det = document.getElementById('details');
  if (VEH){
    const drv = cleanName(VEH.driverName);
    box.innerHTML = `🚗 <b>${esc(VEH.make||'')} ${esc(VEH.model||'')}</b> · <span dir="ltr">${esc(VEH.plate)}</span>`;
    box.style.display = 'block';
    det.style.display = 'block';
    document.getElementById('d-driver').textContent = drv || '—';
    document.getElementById('d-id').textContent = VEH.driverId || '—';
    document.getElementById('d-make').textContent = ((VEH.make||'')+' '+(VEH.model||'')).trim() || '—';
    // division
    const div = detectDivision(VEH.driverName) || 'israel';
    const radio = document.querySelector(`input[name="cp-div"][value="${div}"]`); if(radio) radio.checked = true;
    setCompany();
    const detected = detectDivision(VEH.driverName);
    document.getElementById('div-note').textContent = detected
      ? `זוהה אוטומטית לפי שם העובד: ${detected==='mata'?'מטה':'ישראל'}`
      : '⚠ לא זוהה ישראל/מטה בשם — בחר/י ידנית (ברירת מחדל: ישראל).';
    // color from gov DB
    document.getElementById('d-color').textContent = '…';
    document.getElementById('d-color-note').textContent = '(טוען מהמאגר)';
    const c = await govColor(VEH.plate);
    document.getElementById('d-color').textContent = c || '—';
    document.getElementById('d-color-note').textContent = c ? '(מהמאגר הממשלתי)' : '(לא נמצא — מלא/י למטה)';
    if (c) document.getElementById('f-color-edit').value = c;
  } else {
    box.style.display = 'none'; det.style.display = 'none';
  }
}
function showErr(m){ const e = document.getElementById('err'); e.textContent = m; e.style.display = 'block'; }

function todayStr(){ const t=new Date(); return `${('0'+t.getDate()).slice(-2)}/${('0'+(t.getMonth()+1)).slice(-2)}/${t.getFullYear()}`; }
function _esc(s){ return String(s==null?'':s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function buildPermitHtml(d){
  const val = (v,w) => `<span style="display:inline-block;border-bottom:1px solid #000;min-width:${w||120}px;text-align:center;padding:0 6px;font-weight:700">${_esc(v)||'&nbsp;'}</span>`;
  const sigImg = SIGNATURE ? `<img src="${SIGNATURE}" style="max-width:150px;max-height:70px">` : '';
  return `<div style="width:740px;background:#fff;color:#000;font-family:'Heebo','Arial Hebrew',Arial,sans-serif;direction:rtl;padding:44px 48px;font-size:16px;line-height:2.1;box-sizing:border-box">
    <div style="text-align:left;margin-bottom:28px">תאריך: ${val(d.date,110)}</div>
    <div style="font-weight:800">לכבוד</div>
    <div style="font-weight:800;margin-bottom:2px">${_esc(d.city)||'&nbsp;'}</div>
    <div style="border-bottom:1px solid #000;width:280px;margin-bottom:30px"></div>
    <div style="text-align:center;font-weight:800;text-decoration:underline;margin-bottom:24px;font-size:17px">אישור החזקה ברכב חברה</div>
    <p style="margin:0 0 16px">הנני לאשר בזאת, כי למר/גברת: ${val(d.driver,180)}, ת.ז: ${val(d.driverId,130)}, שעובד/ת בחברת: ${val(d.company,240)}, ח.פ: ${val(d.hp,130)}.</p>
    <p style="margin:0 0 16px">מוצמד רכב כחוק, רישוי: ${val(d.plate,140)}, מסוג: ${val(d.make,200)}, בצבע: ${val(d.color,120)}</p>
    <p style="margin:0 0 44px">ומנוכה ממשכורתו/ה כחוק.</p>
    <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-top:54px">
      <div>
        <div style="border-top:1px solid #000;width:250px;padding-top:5px;font-weight:700">חשב בחברה / ק. בטיחות בתעבורה</div>
        <div style="font-size:13px;margin-top:3px">חתימה + חותמת</div>
      </div>
      <div style="text-align:center;min-width:160px">${sigImg}</div>
    </div>
  </div>`;
}
async function _htmlToCanvasImg(html, W){
  const holder = document.createElement('div');
  holder.style.cssText = 'position:absolute;left:-9999px;top:0;width:' + W + 'px';
  holder.innerHTML = html;
  document.body.appendChild(holder);
  const el = holder.firstElementChild;
  const H = el.scrollHeight;
  const xhtml = new XMLSerializer().serializeToString(el);
  document.body.removeChild(holder);
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}"><foreignObject width="100%" height="100%">${xhtml}</foreignObject></svg>`;
  const img = new Image();
  await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg); });
  const scale = 2, cv = document.createElement('canvas'); cv.width = W * scale; cv.height = H * scale;
  const ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height); ctx.drawImage(img, 0, 0, cv.width, cv.height);
  return { dataUrl: cv.toDataURL('image/jpeg', 0.92), H };
}
async function makePermit(){
  document.getElementById('err').style.display = 'none';
  const plate = (document.getElementById('f-plate').value || '').trim();
  const city = (document.getElementById('f-city').value || '').trim();
  if (!plate){ showErr('נא להזין מספר רכב'); return; }
  if (!VEH){ showErr('הרכב לא זוהה — בדוק/י את מספר הרכב'); return; }
  if (!city){ showErr('נא לבחור את העירייה / הרשות'); return; }
  const btn = document.getElementById('send-btn'); btn.disabled = true; btn.textContent = 'יוצר…';
  try {
    if (document.fonts && document.fonts.ready) { try { await document.fonts.ready; } catch(e){} }
    const val = (document.querySelector('input[name="cp-div"]:checked')||{}).value || 'israel';
    const c = COMPANIES[val];
    const d = {
      date: todayStr(), city,
      driver: cleanName(VEH.driverName), driverId: VEH.driverId || '',
      company: c.name, hp: c.hp, plate: VEH.plate,
      make: ((VEH.make||'')+' '+(VEH.model||'')).trim(),
      color: (document.getElementById('f-color-edit').value || document.getElementById('d-color').textContent || '').trim()
    };
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });
    const im = await _htmlToCanvasImg(buildPermitHtml(d), 740);
    pdf.addImage(im.dataUrl, 'JPEG', 8, 10, 194, im.H * 194 / 740);
    pdf.save(`אישור לעירייה ${d.plate}.pdf`);
    document.getElementById('main-card').style.display = 'none';
    document.getElementById('result').style.display = 'block';
  } catch(e){
    btn.disabled = false; btn.textContent = '📄 צור אישור PDF להדפסה';
    showErr('יצירת האישור נכשלה — נסה/י שוב'); console.log('permit error', e);
  }
}
</script>
</body>
</html>
