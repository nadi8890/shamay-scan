<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ר.מזור — קביעת מועד לביקורת בטיחות</title>
<meta name="theme-color" content="#1e3a8a">
<meta name="apple-mobile-web-app-title" content="ר.מזור">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Heebo',sans-serif;background:#f0f4f8;color:#1e293b;padding:16px;max-width:480px;margin:0 auto}
.hdr{background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;border-radius:14px;padding:18px;text-align:center;margin-bottom:16px}
.hdr h1{font-size:1.15rem;font-weight:900}
.hdr .sub{font-size:0.78rem;opacity:.9;margin-top:4px}
.card{background:#fff;border:1.5px solid #dde3ed;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 5px rgba(0,0,0,.05)}
.veh{background:#eff6ff;border:1.5px solid #bfdbfe;border-radius:10px;padding:12px;font-size:0.9rem;margin-bottom:12px}
.intro{font-size:0.86rem;line-height:1.6;color:#334155;margin-bottom:12px}
.days{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.day{border:1.5px solid #dde3ed;border-radius:11px;padding:11px 8px;text-align:center;cursor:pointer;background:#fff;font-family:'Heebo',sans-serif;transition:.12s}
.day .dow{font-size:0.72rem;color:#64748b}
.day .dt{font-size:1rem;font-weight:800;margin-top:2px;direction:ltr}
.day.sel{background:#2563eb;border-color:#2563eb;color:#fff}
.day.sel .dow{color:#dbeafe}
.day.sat{opacity:.45;pointer-events:none}
.day.sat .dow::after{content:' (שבת)'}
.btn{border:none;border-radius:11px;padding:14px;font-family:'Heebo',sans-serif;font-size:1rem;font-weight:800;cursor:pointer;width:100%;background:#059669;color:#fff;margin-top:14px}
.btn:disabled{opacity:.5}
.err{color:#dc2626;font-size:0.82rem;font-weight:700;margin-top:8px;display:none}
#result{display:none;text-align:center;padding:26px 12px}
#result .big{font-size:3rem}
.contact{font-size:0.78rem;color:#64748b;text-align:center;margin-top:10px}
</style>
</head>
<body>

<div class="hdr">
  <h1>🛡️ קביעת מועד לביקורת בטיחות</h1>
  <div class="sub">ר.מזור — מחלקת הרכב</div>
</div>

<div id="loading" class="card" style="text-align:center;color:#64748b">טוען...</div>

<div id="main" style="display:none">
  <div class="veh" id="veh-info"></div>
  <div class="card">
    <div class="intro" id="intro"></div>
    <div style="font-weight:700;font-size:0.88rem;margin-bottom:8px">בחר/י מועד נוח בטווח השבועיים הקרובים:</div>
    <div class="days" id="days"></div>
    <div class="err" id="err"></div>
    <button class="btn" id="send-btn" disabled onclick="submitBooking()">📅 קבע/י מועד</button>
    <div class="contact">לתיאום או שינוי — קצין הרכב: 054-2840258</div>
  </div>
</div>

<div id="result">
  <div class="big">✅</div>
  <h2 style="margin:10px 0 6px">המועד נקבע — תודה!</h2>
  <div id="result-txt" style="font-size:0.95rem;color:#334155"></div>
  <div class="contact">קצין הבטיחות יאשר את המועד. לשינוי — 054-2840258</div>
</div>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyDW6mzShTVBgHH-c5f0hb7FvIRophpgp78",
  authDomain: "niholrechev.firebaseapp.com",
  projectId: "niholrechev",
  storageBucket: "niholrechev.firebasestorage.app",
  messagingSenderId: "347809967171",
  appId: "1:347809967171:web:af3eb5cdeefc827b41f8f6"
});
const db = firebase.firestore();
async function ensureAnonAuth() {
  try { if (!firebase.auth().currentUser) { try { await firebase.auth().setPersistence(firebase.auth.Auth.Persistence.NONE); } catch(e) {} await firebase.auth().signInAnonymously(); } }
  catch(e) { console.log('anon auth unavailable, continuing', e.code || e.message); }
}

const params = new URLSearchParams(location.search);
const TENANT = (params.get('t') || '').trim();
if (!TENANT) {
  const _stop = () => { document.body.innerHTML =
    '<div style="max-width:420px;margin:60px auto;padding:26px;border-radius:16px;background:#fff;' +
    'font-family:Heebo,Arial,sans-serif;text-align:center;direction:rtl;box-shadow:0 8px 30px rgba(0,0,0,.12)">' +
    '<div style="font-size:2.4rem">🔗</div>' +
    '<h2 style="margin:10px 0 8px;font-size:1.1rem;color:#b91c1c">הקישור אינו שלם</h2>' +
    '<p style="margin:0;color:#475569;font-size:.9rem;line-height:1.6">חסר בו מזהה החברה, ולכן לא ניתן לפתוח אותו.<br>' +
    'בקש מקצין הבטיחות לשלוח את הקישור מחדש מתוך המערכת.</p></div>'; };
  if (document.body) _stop(); else document.addEventListener('DOMContentLoaded', _stop);
  throw new Error('NO_TENANT');
}
const fcol = () => db.collection('tenants').doc(TENANT).collection('data');
const PLATE = (params.get('plate') || '').replace(/\D/g,'');
const DAYS_HE = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
let VEH = null, MAIL = {}, chosen = null;

// window start: the "sent" date from the link, else today. Two-week window.
function windowStart() {
  const s = params.get('sent');
  const d = s ? new Date(s + 'T00:00:00') : new Date();
  return isNaN(d) ? new Date() : d;
}

(async function init() {
  await ensureAnonAuth();
  try {
    let d = {};
    try { const s = await fcol().doc('pubroster').get(); if (s.exists && Array.isArray((s.data()||{}).vehicles)) d = s.data(); } catch(e) {}
    if (!Array.isArray(d.vehicles)) { try { const s = await fcol().doc('main').get(); d = s.data() || {}; } catch(e) {} }
    MAIL = d.mailSettings || {};
    VEH = (d.vehicles || []).find(v => (v.plate||'').replace(/\D/g,'') === PLATE);
  } catch(e) {}
  document.getElementById('loading').style.display = 'none';
  document.getElementById('main').style.display = 'block';
  const nm = VEH ? (VEH.driverName||'').split('-')[0].trim() : '';
  document.getElementById('veh-info').innerHTML = VEH
    ? `👤 <b>${nm||'נהג/ת'}</b><br>🚗 ${VEH.make||''} ${VEH.model||''} | <span dir="ltr">${VEH.plate}</span>`
    : (PLATE ? `🚗 רכב <span dir="ltr">${PLATE}</span>` : '🚗 קביעת מועד לביקורת');
  document.getElementById('intro').innerHTML =
    'ביקורת בטיחות תקופתית לרכב מתקרבת. על מנת לשמור על תקינות הרכב ועמידה בדרישות החוק, נא לקבוע מועד נוח לביצוע הביקורת מול קצין הבטיחות.';
  renderDays();
})();

function renderDays() {
  const start = windowStart();
  const wrap = document.getElementById('days');
  let html = '';
  for (let i = 0; i < 14; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const dow = d.getDay();
    const p2 = n => String(n).padStart(2,'0');
    const val = `${p2(d.getDate())}/${p2(d.getMonth()+1)}/${d.getFullYear()}`;
    const sat = dow === 6; // Saturday — not offered
    html += `<button class="day${sat?' sat':''}" ${sat?'':`onclick="pickDay(this,'${val}')"`}>
      <div class="dow">יום ${DAYS_HE[dow]}</div>
      <div class="dt">${p2(d.getDate())}/${p2(d.getMonth()+1)}</div>
    </button>`;
  }
  wrap.innerHTML = html;
}
function pickDay(el, val) {
  document.querySelectorAll('.day').forEach(d => d.classList.remove('sel'));
  el.classList.add('sel');
  chosen = val;
  document.getElementById('send-btn').disabled = false;
}

async function submitBooking() {
  const err = document.getElementById('err');
  err.style.display = 'none';
  if (!chosen) { err.textContent = 'נא לבחור מועד'; err.style.display = 'block'; return; }
  const btn = document.getElementById('send-btn');
  btn.disabled = true; btn.textContent = 'שולח...';
  const now = new Date();
  const driverName = VEH ? (VEH.driverName||'').split('-')[0].trim() : '';
  const plate = (VEH && VEH.plate) || PLATE;
  try {
    await fcol().doc('inspbook_' + Date.now()).set({
      type: 'inspbooking', created: Date.now(),
      plate: plate,
      driver: driverName,
      bookedDate: chosen,
      sentAt: params.get('sent') || '',
      submittedAt: now.toLocaleString('he-IL'),
      applyBooking: true, applied: false
    });
    // notify the fleet manager by email with a calendar invite (.ics) to reserve the slot
    if (MAIL.gasUrl) {
      try {
        const p2 = n => String(n).padStart(2,'0');
        const [dd,mm,yy] = chosen.split('/');
        const startYmd = `${yy}${mm}${dd}`;
        const nd = new Date(+yy, +mm-1, +dd+1);
        const endYmd = `${nd.getFullYear()}${p2(nd.getMonth()+1)}${p2(nd.getDate())}`;
        const stamp = now.toISOString().replace(/[-:]/g,'').split('.')[0] + 'Z';
        const title = `ביקורת בטיחות — ${driverName} (${plate})`;
        const ics = [
          'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//RMazor//Fleet//HE','CALSCALE:GREGORIAN','METHOD:REQUEST',
          'BEGIN:VEVENT',`UID:inspbook-${Date.now()}@rmazor`,`DTSTAMP:${stamp}`,
          `DTSTART;VALUE=DATE:${startYmd}`,`DTEND;VALUE=DATE:${endYmd}`,
          `SUMMARY:${title}`,
          `DESCRIPTION:ביקורת בטיחות תקופתית שנקבעה ע"י הנהג/ת. רכב ${plate}. לתיאום: 054-2840258`,
          'STATUS:CONFIRMED','BEGIN:VALARM','TRIGGER:-P1D','ACTION:DISPLAY','DESCRIPTION:תזכורת ביקורת בטיחות','END:VALARM',
          'END:VEVENT','END:VCALENDAR'
        ].join('\r\n');
        const icsB64 = btoa(unescape(encodeURIComponent(ics)));
        const body = `הנהג/ת ${driverName} קבע/ה מועד לביקורת בטיחות.\n\nרכב: ${plate}\nמועד שנבחר: ${chosen}\nנקבע בתאריך: ${now.toLocaleString('he-IL')}\n\nמצורף קובץ זימון ליומן (.ics) — פתח/י אותו כדי לשריין את המועד.\n\n(נשלח אוטומטית ע"י מערכת ר.מזור)`;
        await fetch(MAIL.gasUrl, { method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain'},
          body: JSON.stringify({ subject: `📅 נקבע מועד ביקורת — ${driverName} (${plate}) · ${chosen}`, body,
            files: [{ base64: icsB64, mimeType: 'text/calendar', filename: `ביקורת ${plate}.ics` }] }) });
      } catch(e) { console.log('booking email skipped', e); }
    }
    document.getElementById('main').style.display = 'none';
    document.getElementById('result-txt').innerHTML = `נקבע מועד ביקורת ל-<b>${chosen}</b>`;
    document.getElementById('result').style.display = 'block';
    window.scrollTo(0, 0);
  } catch(e) {
    btn.disabled = false; btn.textContent = '📅 קבע/י מועד';
    err.textContent = 'שגיאה בשליחה — בדוק/י חיבור לאינטרנט ונסה/י שוב';
    err.style.display = 'block';
  }
}
</script>
</body>
</html>
