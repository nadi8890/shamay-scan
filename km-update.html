<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ר.מזור — עדכון קילומטראז'</title>
<meta name="theme-color" content="#1e3a8a">
<meta name="apple-mobile-web-app-title" content="ר.מזור">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Heebo',sans-serif;background:#f0f4f8;color:#1e293b;padding:16px;max-width:480px;margin:0 auto}
.hdr{background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;border-radius:14px;padding:18px;text-align:center;margin-bottom:16px}
.hdr h1{font-size:1.15rem;font-weight:900}
.hdr .sub{font-size:0.78rem;opacity:.9;margin-top:4px}
.card{background:#fff;border:1.5px solid #dde3ed;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 5px rgba(0,0,0,.05)}
label{display:block;font-size:0.8rem;font-weight:700;color:#475569;margin-bottom:5px}
input{width:100%;border:1.5px solid #dde3ed;border-radius:10px;padding:12px;font-family:'Heebo',sans-serif;font-size:1.15rem;text-align:center;direction:ltr}
.btn{border:none;border-radius:11px;padding:14px;font-family:'Heebo',sans-serif;font-size:1rem;font-weight:800;cursor:pointer;width:100%;background:#059669;color:#fff}
.btn:disabled{opacity:.6}
.veh{background:#f0fdf4;border:1.5px solid #86efac;border-radius:10px;padding:12px;font-size:0.9rem;margin-bottom:12px}
.err{color:#dc2626;font-size:0.82rem;font-weight:700;margin-top:8px;display:none}
.hint{font-size:0.72rem;color:#64748b;margin-top:5px;text-align:center}
#result{display:none;text-align:center;padding:24px 12px;position:relative}
#result .big{font-size:3rem}
#result .badge{width:100px;height:100px;margin:2px auto 0;border-radius:50%;background:linear-gradient(135deg,#059669,#10b981);display:flex;align-items:center;justify-content:center;font-size:3.1rem;box-shadow:0 12px 34px rgba(16,185,129,.42);animation:badgePop .6s cubic-bezier(.17,.67,.32,1.5) both}
#result h2{margin:16px 0 4px;font-size:1.5rem;font-weight:900;background:linear-gradient(90deg,#1e3a8a,#2563eb,#10b981);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:doneUp .5s .1s both}
#result .done-sub{color:#475569;font-size:0.88rem;animation:doneUp .5s .2s both}
@keyframes badgePop{0%{transform:scale(0) rotate(-25deg);opacity:0}70%{transform:scale(1.12) rotate(6deg)}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes doneUp{0%{opacity:0;transform:translateY(14px)}100%{opacity:1;transform:translateY(0)}}
#confetti-layer{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9999}
#confetti-layer i{position:absolute;top:-14px;width:9px;height:15px;border-radius:2px;opacity:0;animation:confFall linear forwards}
@keyframes confFall{0%{opacity:1;transform:translateY(-14px) rotate(0)}100%{opacity:.85;transform:translateY(112vh) rotate(760deg)}}
.status-ok{background:#f0fdf4;border:2px solid #22c55e;border-radius:12px;padding:14px;margin-top:14px;font-size:0.9rem}
.status-warn{background:#fffbeb;border:2px solid #f59e0b;border-radius:12px;padding:14px;margin-top:14px;font-size:0.9rem;font-weight:700}
.status-due{background:#fef2f2;border:2px solid #ef4444;border-radius:12px;padding:14px;margin-top:14px;font-size:0.95rem;font-weight:800}
</style>
</head>
<body>

<div class="hdr">
  <h1>🛣️ עדכון קילומטראז' חודשי</h1>
  <div class="sub">ר.מזור — מחלקת הרכב</div>
</div>

<div id="step-plate" class="card" style="display:none">
  <label>הקלד/י את מספר הרכב שלך (מופיע על לוחית הרישוי)</label>
  <input id="plate-inp" inputmode="numeric" placeholder="12345678">
  <div class="err" id="plate-err"></div>
  <button class="btn" style="margin-top:12px" onclick="findVehicle()">המשך ←</button>
</div>

<div id="step-km" style="display:none">
  <div class="veh" id="veh-info"></div>
  <div class="card">
    <label>קריאת מד המרחק הנוכחית (ק"מ)</label>
    <input id="km-inp" inputmode="numeric" placeholder="">
    <div class="hint" id="km-hint"></div>
    <div class="err" id="km-err"></div>
    <button class="btn" style="margin-top:12px" id="send-btn" onclick="submitKm()">✅ עדכן קילומטראז'</button>
  </div>
</div>

<div id="result">
  <div class="badge" id="km-badge">🎉</div>
  <h2 id="km-title">כל הכבוד!</h2>
  <p class="done-sub" id="km-sub">הקילומטראז' עודכן בהצלחה במערכת.</p>
  <div id="service-status"></div>

  <div id="service-upload" style="display:none;margin-top:16px;text-align:right;background:#fff;border:1.5px solid #fdba74;border-radius:12px;padding:14px">
    <div style="font-weight:800;color:#9a3412;font-size:0.92rem;margin-bottom:5px">כבר ביצעת את הטיפול? ✅</div>
    <div style="font-size:0.8rem;color:#475569;margin-bottom:11px;line-height:1.5">צרף/י אישור / חשבונית טיפול — היא תישלח ישירות למחלקת הרכב לאישור וסגירה.</div>
    <button type="button" class="btn" style="background:#eef2ff;color:#3730a3;border:1.5px dashed #a5b4fc" onclick="document.getElementById('svc-file').click()">📷 צלם / בחר קובץ</button>
    <!-- בלי capture — ר' ההסבר ב-driver-task: אחרת אי אפשר לצרף קובץ שמור -->
    <input id="svc-file" type="file" accept="image/*,application/pdf" multiple style="display:none" onchange="onSvcFiles(this.files)">
    <div id="svc-thumbs" style="display:flex;flex-wrap:wrap;gap:8px;margin:11px 0"></div>
    <textarea id="svc-note" rows="2" placeholder="הערה (אופציונלי): שם המוסך, תאריך הטיפול..." style="width:100%;border:1.5px solid #dde3ed;border-radius:10px;padding:10px;font-family:'Heebo',sans-serif;font-size:0.88rem;resize:vertical"></textarea>
    <div class="err" id="svc-err" style="display:none"></div>
    <button class="btn" id="svc-send" style="margin-top:11px" onclick="submitServiceDoc()">📤 שלח אישור טיפול למחלקת הרכב</button>
  </div>
  <div id="svc-done" style="display:none;margin-top:16px;background:#ecfdf5;border:1.5px solid #86efac;border-radius:12px;padding:16px;font-weight:800;color:#047857">✅ האישור נשלח למחלקת הרכב — תודה!</div>
</div>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyDW6mzShTVBgHH-c5f0hb7FvIRophpgp78",
  authDomain: "niholrechev.firebaseapp.com",
  projectId: "niholrechev",
  storageBucket: "niholrechev.firebasestorage.app",
  messagingSenderId: "347809967171",
  appId: "1:347809967171:web:af3eb5cdeefc827b41f8f6"
});
const db = firebase.firestore();
// Sign this browser in anonymously — invisible to the driver (no login screen, no
// extra tap) but it gives the database an identity to check. Failure is non-fatal:
// the app keeps working exactly as before.
async function ensureAnonAuth() {
  try {
    if (firebase.auth().currentUser) return;
    // in-memory only, so the driver's anonymous session never overwrites the
    // manager's email/password session stored on the same site
    try { await firebase.auth().setPersistence(firebase.auth.Auth.Persistence.NONE); } catch(e) {}
    await firebase.auth().signInAnonymously();
  } catch(e) { console.log('anon auth unavailable, continuing', e.code || e.message); }
}
let VEH = null, MAIL = {}, FLEET = [];
const _kmParams = new URLSearchParams(location.search);
const TENANT = (_kmParams.get('t') || 'nofar');
const fcol = () => db.collection('tenants').doc(TENANT).collection('data');
const urlPlate = (_kmParams.get('plate') || '').replace(/\D/g,'');
const parseKmNum = s => parseInt(String(s||'').replace(/\D/g,'')) || 0;

let _kmLoadErr = null, _kmLoaded = false;
(async function init() {
  await ensureAnonAuth(); // must precede any read so the identity is in place
  try {
    let d = {};
    try { const s = await fcol().doc('pubroster').get(); if (s.exists && Array.isArray((s.data()||{}).vehicles)) d = s.data(); } catch(e) {}
    if (!Array.isArray(d.vehicles)) { try { const s = await fcol().doc('main').get(); d = s.data() || {}; } catch(e) {} }
    FLEET = d.vehicles || [];
    MAIL = d.mailSettings || {};
    _kmLoaded = true;
  } catch(e) { _kmLoadErr = e; }
  if (urlPlate) selectVehicle(urlPlate);
  else document.getElementById('step-plate').style.display = 'block';
})();

function selectVehicle(plateDigits) {
  const err = document.getElementById('plate-err');
  document.getElementById('step-plate').style.display = 'block';
  // אבחון: הבחנה בין כשל טעינה, רשימה ריקה, ומספר שלא קיים
  if (_kmLoadErr) {
    err.textContent = 'שגיאה בטעינת המערכת: ' + (_kmLoadErr.code || _kmLoadErr.message || 'נסה/י שוב') + '. בדוק/י חיבור לאינטרנט.';
    err.style.display = 'block'; return;
  }
  if (!FLEET.length) {
    err.textContent = 'רשימת הרכבים לא נטענה. ודא/י שהקישור מלא ונסה/י שוב, או פנה/י למחלקת הרכב.';
    err.style.display = 'block'; return;
  }
  VEH = FLEET.find(v => String(v.plate||'').replace(/\D/g,'') === plateDigits);  // String(): מספר רכב עשוי להיות מספר ולא מחרוזת
  if (!VEH) {
    if (plateDigits) { err.textContent = 'מספר הרכב לא נמצא במערכת — בדוק/י ונסה/י שוב'; err.style.display = 'block'; }
    return;
  }
  err.style.display = 'none';
  document.getElementById('step-plate').style.display = 'none';
  document.getElementById('step-km').style.display = 'block';
  const nm = (VEH.driverName||'').split('-')[0].trim();
  const prev = parseKmNum(VEH.currentKm);
  const next = parseKmNum(VEH.nextServiceKm);
  // Show the driver everything relevant to them: their vehicle, the last reading
  // on record, and where the next service stands.
  const rows = [
    `👤 <b>${nm||'נהג/ת'}</b>`,
    `🚗 ${VEH.make||''} ${VEH.model||''} | <span dir="ltr">${VEH.plate}</span>`,
    `📊 ק"מ אחרון שדווח: <b>${prev ? prev.toLocaleString() : 'טרם דווח'}</b>`
  ];
  if (next) {
    const left = next - prev;
    rows.push(prev && left <= 0
      ? `🔧 <b style="color:#dc2626">הרכב הגיע לטיפול</b> (${next.toLocaleString()} ק"מ)`
      : `🔧 טיפול הבא: <b>${next.toLocaleString()}</b> ק"מ${prev ? ` — עוד ${left.toLocaleString()} ק"מ` : ''}`);
  }
  document.getElementById('veh-info').innerHTML = rows.join('<br>');
  document.getElementById('km-inp').placeholder = prev ? String(prev) : 'לדוגמה: 45000';
  document.getElementById('km-hint').textContent = prev
    ? `הק"מ האחרון שדווח: ${prev.toLocaleString()}`
    : 'טרם דווח ק"מ לרכב זה';
}
function findVehicle() {
  document.getElementById('plate-err').style.display = 'none';
  selectVehicle(document.getElementById('plate-inp').value.replace(/\D/g,''));
}

async function submitKm() {
  const err = document.getElementById('km-err');
  err.style.display = 'none';
  const km = parseKmNum(document.getElementById('km-inp').value);
  const prev = parseKmNum(VEH.currentKm);
  if (!km) { err.textContent = 'נא להזין קריאת ק"מ'; err.style.display = 'block'; return; }
  if (prev && km < prev) { err.textContent = `הק"מ שהוזן (${km.toLocaleString()}) נמוך מהדיווח הקודם (${prev.toLocaleString()}) — בדוק/י שוב`; err.style.display = 'block'; return; }
  if (prev && km > prev + 100000) { err.textContent = 'הק"מ שהוזן גבוה באופן חריג — בדוק/י שוב'; err.style.display = 'block'; return; }
  const btn = document.getElementById('send-btn');
  btn.disabled = true; btn.textContent = 'שולח...';
  const now = new Date();
  const p2 = n => String(n).padStart(2,'0');
  const monthKey = `${now.getFullYear()}-${p2(now.getMonth()+1)}`;
  const next = parseKmNum(VEH.nextServiceKm);
  const serviceDue = next > 0 && km >= next;
  const serviceSoon = next > 0 && !serviceDue && (next - km) <= 500;
  try {
    // 1. km report (one per vehicle per month — overwrites on repeat fill).
    // applyKm flags it so the signed-in manager writes the km onto the vehicle.
    await fcol().doc(`kmr_${monthKey}_${VEH.plate}`).set({
      type: 'kmreport', created: Date.now(), monthKey,
      dateStr: `${p2(now.getDate())}/${p2(now.getMonth()+1)}/${now.getFullYear()} ${p2(now.getHours())}:${p2(now.getMinutes())}`,
      plate: VEH.plate, driver: (VEH.driverName||'').split('-')[0].trim(),
      km: String(km), prevKm: String(prev||''), nextServiceKm: String(next||''), serviceDue, serviceSoon,
      applyKm: true, applied: false
    });
    // 2. best-effort direct update — drivers aren't signed in so the rules block
    // this; the manager's app applies the km from the report. Never fail the form.
    try {
      for (let attempt = 0; attempt < 3; attempt++) {
        const snap = await fcol().doc('main').get();
        const vehicles = (snap.data()||{}).vehicles || [];
        const v = vehicles.find(x => String(x.plate||'').replace(/\D/g,'') === String(VEH.plate||'').replace(/\D/g,''));
        if (!v) break;
        if (parseKmNum(v.currentKm) === km) break;
        v.currentKm = String(km);
        await fcol().doc('main').set({ vehicles }, { merge: true });
        await new Promise(res => setTimeout(res, 1500));
      }
    } catch(e) { console.log('km update deferred to manager', e); }
    // 3. alert the manager by email when a service is due
    if ((serviceDue || serviceSoon) && MAIL.gasUrl) {
      try {
        await fetch(MAIL.gasUrl, { method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain'},
          body: JSON.stringify({ subject: `🔧 ${serviceDue ? 'נדרש טיפול' : 'טיפול מתקרב'} — רכב ${VEH.plate}`, body: `${(VEH.driverName||'').split('-')[0]} עדכן/ה ק"מ: ${km.toLocaleString()}\nטיפול ב: ${next.toLocaleString()}\nרכב: ${VEH.make||''} ${VEH.model||''} (${VEH.plate})`, files: [] }) });
      } catch(e) {}
    }
    // feedback to the driver
    const st = document.getElementById('service-status');
    if (serviceDue) st.innerHTML = `<div class="status-due">🔧 הרכב הגיע לטיפול תקופתי (${next.toLocaleString()} ק"מ)<br>נא לתאם מול קצין הרכב: 054-2840258</div>`;
    else if (serviceSoon) st.innerHTML = `<div class="status-warn">⚠️ הטיפול הבא מתקרב — בעוד ${(next-km).toLocaleString()} ק"מ (ב-${next.toLocaleString()})</div>`;
    else if (next) st.innerHTML = `<div class="status-ok">✓ הכל תקין. הטיפול הבא ב-${next.toLocaleString()} ק"מ (עוד ${(next-km).toLocaleString()} ק"מ)</div>`;
    document.getElementById('step-km').style.display = 'none';
    document.getElementById('result').style.display = 'block';
    celebrate((VEH.driverName||'').split('-')[0].trim());
    // חריגת טיפול — לאפשר לעובד לצרף אישור טיפול שיישלח למחלקת הרכב (מייל + מגירת אישורים)
    window._svcKm = km;
    if (serviceDue || serviceSoon) document.getElementById('service-upload').style.display = 'block';
  } catch(e) {
    btn.disabled = false; btn.textContent = '✅ עדכן קילומטראז\'';
    err.textContent = 'שגיאה בשליחה — בדוק/י חיבור לאינטרנט ונסה/י שוב';
    err.style.display = 'block';
  }
}

// ═══ צירוף אישור טיפול (בחריגת טיפול) — נשלח למחלקת הרכב במייל + נכנס למגירת הקריאות ═══
const SVC_FILES = [];
const SVC_MAX = 900 * 1024;
function _svcBytes(){ return SVC_FILES.reduce((s,f)=> s + Math.ceil(f.data.length*0.75), 0); }
function _svcCompress(file){
  return new Promise((res,rej)=>{
    const fr = new FileReader();
    fr.onload = () => { const img = new Image();
      img.onload = () => { const max=1400; let w=img.width,h=img.height;
        if(w>max||h>max){ const r=Math.min(max/w,max/h); w=Math.round(w*r); h=Math.round(h*r); }
        const cv=document.createElement('canvas'); cv.width=w; cv.height=h; cv.getContext('2d').drawImage(img,0,0,w,h);
        const u=cv.toDataURL('image/jpeg',0.6); res({kind:'image',name:file.name||'photo.jpg',mime:'image/jpeg',data:u.split(',')[1],preview:u}); };
      img.onerror=rej; img.src=fr.result; };
    fr.onerror=rej; fr.readAsDataURL(file);
  });
}
function _svcPdf(file){ return new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res({kind:'pdf',name:file.name||'document.pdf',mime:'application/pdf',data:String(fr.result).split(',')[1],preview:null}); fr.onerror=rej; fr.readAsDataURL(file); }); }
async function onSvcFiles(list){
  for(const file of Array.from(list||[])){
    if(SVC_FILES.length>=5){ _svcErr('אפשר עד 5 קבצים'); break; }
    try { SVC_FILES.push(file.type==='application/pdf' ? await _svcPdf(file) : await _svcCompress(file)); } catch(e){ _svcErr('קובץ לא נתמך'); }
  }
  document.getElementById('svc-file').value='';
  _svcThumbs();
}
function _svcThumbs(){
  document.getElementById('svc-thumbs').innerHTML = SVC_FILES.map((f,i)=>
    `<div style="position:relative;width:70px;height:70px;border-radius:9px;overflow:hidden;border:1.5px solid #dde3ed;background:#f8fafc;display:flex;align-items:center;justify-content:center;font-size:0.6rem;color:#475569;text-align:center;padding:3px">${f.kind==='image'?`<img src="${f.preview}" style="width:100%;height:100%;object-fit:cover">`:'📄 PDF'}<button onclick="_svcRemove(${i})" style="position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;border:none;background:rgba(220,38,38,.92);color:#fff;font-size:0.7rem;line-height:1;cursor:pointer;padding:0">✕</button></div>`
  ).join('');
}
function _svcRemove(i){ SVC_FILES.splice(i,1); _svcThumbs(); }
function _svcErr(m){ const e=document.getElementById('svc-err'); e.textContent=m; e.style.display='block'; }
async function submitServiceDoc(){
  const e=document.getElementById('svc-err'); e.style.display='none';
  if(!SVC_FILES.length){ _svcErr('נא לצרף לפחות קובץ אחד'); return; }
  if(_svcBytes()>SVC_MAX){ _svcErr('הקבצים גדולים מדי (~900KB). צלם/י באיכות נמוכה יותר או הסר/י קובץ.'); return; }
  const btn=document.getElementById('svc-send'); btn.disabled=true; btn.textContent='שולח…';
  const drv=(VEH.driverName||'').split('-')[0].trim();
  const note=(document.getElementById('svc-note').value||'').trim();
  const created=Date.now();
  const rec={ type:'requirement', reqType:'service', reqLabel:'אישור טיפול תקופתי', plate:VEH.plate, driver:drv,
    note, files:SVC_FILES.map(f=>({name:f.name,mime:f.mime,kind:f.kind,base64:f.data})),
    status:'pending', created, dateStr:new Date(created).toLocaleDateString('he-IL'), km:String(window._svcKm||''), scanned:false, applied:false };
  try {
    await fcol().doc('req_'+created).set(rec);
    if(MAIL.gasUrl){
      try {
        await fetch(MAIL.gasUrl,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},
          body:JSON.stringify({ subject:`🔧 אישור טיפול — רכב ${VEH.plate} (${drv})`,
            body:`${drv} צירף/ה אישור טיפול לרכב ${VEH.make||''} ${VEH.model||''} (${VEH.plate}).\nק"מ נוכחי: ${(window._svcKm||0).toLocaleString()}\n${note?('הערה: '+note+'\n'):''}\nהקריאה ממתינה לאישור במסך ההתראות ← קריאות לאישור.`,
            files:SVC_FILES.map((f,i)=>({ base64:f.data, mimeType:f.mime, filename:f.name||('svc'+(i+1)+(f.kind==='pdf'?'.pdf':'.jpg')) })) }) });
      } catch(err){}
    }
    document.getElementById('service-upload').style.display='none';
    document.getElementById('svc-done').style.display='block';
  } catch(err){ btn.disabled=false; btn.textContent='📤 שלח אישור טיפול למחלקת הרכב'; _svcErr('שגיאה בשליחה — בדוק/י חיבור ונסה/י שוב'); console.log(err); }
}

// ═══ הודעת מערכת חגיגית לעובד בסיום עדכון הק"מ ═══
function celebrate(name) {
  const first = String(name || '').trim().split(/[\s\-]/)[0] || '';
  const cheers = [
    { e: '🎉', t: first ? `כל הכבוד, ${first}!` : 'כל הכבוד!' },
    { e: '💪', t: first ? `אין עליך, ${first}!` : 'אין עליך!' },
    { e: '✨', t: 'מושלם!' },
    { e: '🚀', t: first ? `${first}, אלוף/ה!` : 'אלוף/ה אמיתי/ת!' },
    { e: '🏆', t: 'עבודה מצוינת!' },
    { e: '👏', t: first ? `יישר כוח, ${first}!` : 'יישר כוח!' }
  ];
  const pick = cheers[Math.floor(Math.random() * cheers.length)];
  const badge = document.getElementById('km-badge'); if (badge) badge.textContent = pick.e;
  const title = document.getElementById('km-title'); if (title) title.textContent = pick.t;
  _confetti();
}
function _confetti() {
  let layer = document.getElementById('confetti-layer');
  if (layer) layer.remove();
  layer = document.createElement('div'); layer.id = 'confetti-layer';
  const colors = ['#f59e0b','#10b981','#2563eb','#ef4444','#8b5cf6','#ec4899','#14b8a6'];
  for (let i = 0; i < 90; i++) {
    const c = document.createElement('i');
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = colors[i % colors.length];
    c.style.animationDuration = (2.2 + Math.random() * 1.8) + 's';
    c.style.animationDelay = (Math.random() * 0.5) + 's';
    if (Math.random() < 0.5) c.style.borderRadius = '50%';
    c.style.transform = `scale(${0.7 + Math.random() * 0.9})`;
    layer.appendChild(c);
  }
  document.body.appendChild(layer);
  setTimeout(() => layer.remove(), 4600);
}
</script>
